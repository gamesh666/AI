# Mosquitto 2.x — AI VMS platform
# Credentials are generated at container start from environment variables (see entrypoint.sh).

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

per_listener_settings false
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# QoS1 buffering for slow consumers
max_queued_messages 10000
max_inflight_messages 100

listener 1883 0.0.0.0
protocol mqtt

# Browser / debugging access over WebSockets (optional)
listener 9001 0.0.0.0
protocol websockets

# For TLS in production:
# listener 8883
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
